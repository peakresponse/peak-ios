format_version: "23"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios
trigger_map:
- push_branch: '*'
  workflow: primary
workflows:
  primary:
    steps:
    - activate-ssh-key:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone: {}
    - certificate-and-profile-installer: {}
    - recreate-user-schemes:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
    - restore-cocoapods-cache: {}
    - cocoapods-install: {}
    - save-cocoapods-cache: {}
    - restore-spm-cache: {}
    - xcode-test:
        inputs:
        - project_path: $BITRISE_PROJECT_PATH
        - scheme: $BITRISE_SCHEME
        - destination: platform=iOS Simulator,arch=x86_64,name=iPhone 16 Pro,OS=18.6
        - xcodebuild_options: ARCHS=x86_64
    - save-spm-cache: {}
    - deploy-to-bitrise-io: {}
app:
  envs:
  - opts:
      is_expand: false
    BITRISE_PROJECT_PATH: Triage.xcworkspace
  - opts:
      is_expand: false
    BITRISE_SCHEME: Triage
  - opts:
      is_expand: false
    BITRISE_EXPORT_METHOD: development
  - opts:
      is_expand: false
    AgoraAppId:
  - opts:
      is_expand: false
    ApiClientServerUrl: http://localhost
  - opts:
      is_expand: false
    GoogleMapsSdkApiKey:
  - opts:
      is_expand: false
    RollbarEnvironment: test
meta:
  bitrise.io:
    stack: osx-xcode-26.4.x
    machine_type_id: g2-m1.4core
